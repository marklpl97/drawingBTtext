<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KALKULATOROKON</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js  "></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js  "></script>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .window-input { margin: 15px 0; padding: 15px; border: 1px solid #ccc; }
        canvas { border: 1px solid #666; margin-top: 20px; background: white; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; background: #4CAF50; color: white; border: none; }
        input, select, textarea { margin: 5px; padding: 5px; }
        label { font-weight: bold; }
        .controls { margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; display: flex; flex-direction: column; gap: 10px; }
        .canvas-container { margin-top: 20px; }
        .text-controls { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
        textarea { width: 400px; height: 60px; resize: vertical; }
    </style>
</head>
<body>
    <h1>KALKULATOROKON</h1>
    <label>Количество окон (1-10): <input type="number" id="windowCount" min="1" max="10" value="1" onchange="renderInputs()"></label>
    
    <div class="controls">
        <label>Масштаб изображения: 
            <input type="range" id="scaleSlider" min="0.1" max="2.0" step="0.1" value="0.7" oninput="updateScaleValue()">
            <span id="scaleValue">0.7</span>
        </label>
        <div class="text-controls">
            <label>Общий текст на чертеже:
                <textarea id="drawingText" placeholder="Введите текст для нижнего правого угла..."></textarea>
            </label>
            <label>Размер шрифта:
                <select id="textFontSize">
                    <option value="10">10px</option>
                    <option value="12" selected>12px</option>
                    <option value="14">14px</option>
                    <option value="16">16px</option>
                    <option value="18">18px</option>
                    <option value="20">20px</option>
                </select>
            </label>
        </div>
    </div>
    
    <div id="inputsContainer"></div>
    <div>
        <button onclick="downloadExcel()">Скачать Excel</button>
        <button onclick="drawWindows()">Обновить чертеж</button>
        <button onclick="downloadDrawing()">Скачать чертеж (.png)</button>
    </div>
    <div id="canvasContainer"></div>

    <script>
        let windowData = [];
        let currentScale = 0.7;

        function updateScaleValue() {
            const slider = document.getElementById('scaleSlider');
            currentScale = parseFloat(slider.value);
            document.getElementById('scaleValue').textContent = currentScale.toFixed(1);
        }

        function renderInputs() {
            const count = parseInt(document.getElementById('windowCount').value);
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            windowData = [];

            for (let i = 1; i <= count; i++) {
                const div = document.createElement('div');
                div.className = 'window-input';
                div.innerHTML = `
                    <h3>Окно A${i}</h3>
                    Крепеж: <select id="fix${i}">
                        <option>Л</option><option>ПР</option><option>ППС</option><option>ПМС</option><option>ФЗ</option>
                    </select><br>
                    Молния: <select id="zipper${i}">
                        <option value="0">нет</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select><br>
                    <label>Карман: 
                        <select id="pocket${i}">
                            <option value="нет">нет</option>
                            <option value="да">да</option>
                        </select>
                    </label><br>
                    <label>Размеры: 
                        <select id="dimType${i}">
                            <option value="inner">внутренние</option>
                            <option value="outer">наружные</option>
                        </select>
                    </label><br>
                    Верх (см): <input type="number" id="top${i}" required><br>
                    Низ (см): <input type="number" id="bottom${i}" required><br>
                    Лев (см): <input type="number" id="left${i}" required><br>
                    Пр (см): <input type="number" id="right${i}" required><br>
                    <label>Текст под фигурой: <input type="text" id="winText${i}" placeholder="Текст под окном" style="width: 100%; max-width: 300px;"></label>
                `;
                container.appendChild(div);
                windowData.push({
                    id: `A${i}`,
                    fix: 'Л',
                    top: 0,
                    bottom: 0,
                    left: 0,
                    right: 0,
                    zipper: '0',
                    pocket: 'нет',
                    dimType: 'inner',
                    text: ''
                });
            }
        }

        function collectData() {
            windowData.forEach((win, i) => {
                const idx = i + 1;
                win.fix = document.getElementById(`fix${idx}`).value;
                win.zipper = document.getElementById(`zipper${idx}`).value || '0';
                win.pocket = document.getElementById(`pocket${idx}`).value || 'нет';
                win.dimType = document.getElementById(`dimType${idx}`).value || 'inner';
                win.top = parseFloat(document.getElementById(`top${idx}`).value) || 0;
                win.bottom = parseFloat(document.getElementById(`bottom${idx}`).value) || 0;
                win.left = parseFloat(document.getElementById(`left${idx}`).value) || 0;
                win.right = parseFloat(document.getElementById(`right${idx}`).value) || 0;
                win.text = document.getElementById(`winText${idx}`).value || '';
            });
        }

        function downloadExcel() {
            collectData();
            const wsData = [
                ['Окно', 'Верх (см)', 'Низ (см)', 'Лев (см)', 'Пр (см)', 'Крепеж', 'Молния', 'Карман', 'Max b (см)', 'Max h (см)', 'S (м²)', 'S с окант. (м²)', 'Текст']
            ];

            windowData.forEach(win => {
                const maxB = Math.max(win.top, win.bottom);
                const maxH = Math.max(win.left, win.right);
                const area = (maxB * maxH) / 10000;
                const areaWithEdge = area * 1.1;

                wsData.push([
                    win.id,
                    win.top,
                    win.bottom,
                    win.left,
                    win.right,
                    win.fix,
                    win.zipper,
                    win.pocket,
                    maxB,
                    maxH,
                    area.toFixed(4),
                    areaWithEdge.toFixed(4),
                    win.text
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, 'Окна');
            XLSX.writeFile(wb, 'KALKULATOROKON.xlsx');
        }

        function calculateOuterContour(innerPoints, offset, offsetBottom) {
            function getNormal(x1, y1, x2, y2, forBottom) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const length = Math.sqrt(dx * dx + dy * dy);
                if (length === 0) return { x: 0, y: 0 };
                return {
                    x: dy / length * (forBottom ? offsetBottom : offset),
                    y: -dx / length * (forBottom ? offsetBottom : offset)
                };
            }

            const len = innerPoints.length;
            
            let maxY = -Infinity;
            for (let p of innerPoints) {
                if (p.y > maxY) maxY = p.y;
            }

            const normals = [];
            for (let i = 0; i < len; i++) {
                const p1 = innerPoints[i];
                const p2 = innerPoints[(i + 1) % len];
                const isBottom = (Math.abs(p1.y - maxY) < 0.1 && Math.abs(p2.y - maxY) < 0.1);
                normals.push(getNormal(p1.x, p1.y, p2.x, p2.y, isBottom));
            }

            const outerPoints = [];
            for (let i = 0; i < len; i++) {
                const prevNormal = normals[(i - 1 + len) % len];
                const currNormal = normals[i];
                const point = innerPoints[i];

                const A1 = {
                    x: point.x + prevNormal.x,
                    y: point.y + prevNormal.y
                };
                const A2 = {
                    x: point.x + prevNormal.x + (innerPoints[(i - 1 + len) % len].x - point.x),
                    y: point.y + prevNormal.y + (innerPoints[(i - 1 + len) % len].y - point.y)
                };

                const B1 = {
                    x: point.x + currNormal.x,
                    y: point.y + currNormal.y
                };
                const B2 = {
                    x: point.x + currNormal.x + (innerPoints[(i + 1) % len].x - point.x),
                    y: point.y + currNormal.y + (innerPoints[(i + 1) % len].y - point.y)
                };

                const denominator = (A1.x - A2.x) * (B1.y - B2.y) - (A1.y - A2.y) * (B1.x - B2.x);
                if (Math.abs(denominator) < 0.0001) {
                    outerPoints.push({
                        x: point.x + currNormal.x,
                        y: point.y + currNormal.y
                    });
                } else {
                    const t = ((A1.x - B1.x) * (B1.y - B2.y) - (A1.y - B1.y) * (B1.x - B2.x)) / denominator;
                    outerPoints.push({
                        x: A1.x + t * (A2.x - A1.x),
                        y: A1.y + t * (A2.y - A1.y)
                    });
                }
            }
            return outerPoints;
        }

        function drawWavyLine(ctx, startX, startY, endX, endY, waveLength = 6, amplitude = 3) {
            const dx = endX - startX;
            const dy = endY - startY;
            const length = Math.sqrt(dx * dx + dy * dy);
            const wavesCount = Math.floor(length / waveLength);
            const angle = Math.atan2(dy, dx);

            ctx.save();
            ctx.translate(startX, startY);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            for (let i = 0; i < wavesCount; i++) {
                const x = i * waveLength;
                const y = (i % 2 === 0) ? amplitude : -amplitude;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(length, 0);
            ctx.stroke();
            ctx.restore();
        }

        function isRectangle(win) {
            return win.top === win.bottom && win.left === win.right;
        }

        function drawWindows() {
            collectData();
            const container = document.getElementById('canvasContainer');
            container.innerHTML = '';
            
            const canvasWidth = 1200;
            const canvasHeight = 800;
            const standardOffset = 10;
            const pocketExtraOffset = 18;
            const padding = 100; 
            const sheetPadding = 50;
            const zipperInnerOffset = 4;
            
            const scale = currentScale;
            let currentSheet = 1;
            let figuresToDraw = [...windowData];
            let sheets = [];
            
            const footerText = document.getElementById('drawingText').value;
            const footerFontSize = parseInt(document.getElementById('textFontSize').value) || 12;
            
            while (figuresToDraw.length > 0) {
                const canvas = document.createElement('canvas');
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                canvas.id = `canvas-${currentSheet}`;
                canvas.style.display = 'block';
                canvas.style.marginTop = '20px';
                canvas.style.border = '1px solid #666';
                canvas.style.background = 'white';
                
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.fillStyle = '#000';
                
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`чертеж ${currentSheet}`, 10, canvas.height - 10);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let x = sheetPadding + standardOffset;
                let y = sheetPadding + standardOffset;
                let rowHeight = 0;
                let figuresDrawn = [];
                
                for (let i = 0; i < figuresToDraw.length; i++) {
                    const win = figuresToDraw[i];
                    const bottomWidth = win.bottom * scale;
                    const topWidth = win.top * scale;
                    const leftHeight = win.left * scale;
                    const rightHeight = win.right * scale;
                    const windowHeight = Math.max(leftHeight, rightHeight);
                    
                    if (x + bottomWidth + padding + standardOffset * 2 > canvas.width) {
                        x = sheetPadding + standardOffset;
                        y += rowHeight + padding;
                        rowHeight = 0;
                    }
                    
                    if (y + windowHeight + standardOffset * 2 + padding > canvas.height - sheetPadding) {
                        break;
                    }
                    
                    const innerPoints = [
                        { x: x + (bottomWidth - topWidth) / 2, y: y + (windowHeight - leftHeight) },
                        { x: x + (bottomWidth + topWidth) / 2, y: y + (windowHeight - rightHeight) },
                        { x: x + bottomWidth, y: y + windowHeight },
                        { x: x, y: y + windowHeight }
                    ];
                    
                    const uniqueInnerPoints = [];
                    for (let k = 0; k < innerPoints.length; k++) {
                        if (k === 0 || 
                            Math.abs(innerPoints[k].x - innerPoints[k-1].x) > 0.1 || 
                            Math.abs(innerPoints[k].y - innerPoints[k-1].y) > 0.1) {
                            uniqueInnerPoints.push(innerPoints[k]);
                        }
                    }

                    const enlargedOffset = standardOffset * 2;
                    const enlargedOffsetBottom = (win.pocket === 'да') ? (enlargedOffset + pocketExtraOffset) : enlargedOffset;
                    
                    const outerPoints = calculateOuterContour(uniqueInnerPoints, enlargedOffset, enlargedOffsetBottom);
                    
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    outerPoints.forEach((point, j) => {
                        if (j === 0) ctx.moveTo(point.x, point.y);
                        else ctx.lineTo(point.x, point.y);
                    });
                    ctx.closePath();
                    ctx.stroke();
                    
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    innerPoints.forEach((point, j) => {
                        if (j === 0) ctx.moveTo(point.x, point.y);
                        else ctx.lineTo(point.x, point.y);
                    });
                    ctx.closePath();
                    ctx.stroke();
                    
                    const centerX = x + bottomWidth / 2;
                    const centerY = y + windowHeight / 2;
                    ctx.font = '12px Arial';
                    ctx.fillText(`${win.id} (${win.fix})`, centerX, centerY);
                    
                    // --- Размерные цифры ---
                    ctx.font = 'bold 14px Arial'; 
                    
                    const isOuter = (win.dimType === 'outer');
                    // Вычисляем "внутренние" точки с отступом от контура для подписей
                    const dimPoints = isOuter ? outerPoints : [
                        { x: innerPoints[0].x + 10, y: innerPoints[0].y + 10 },
                        { x: innerPoints[1].x - 10, y: innerPoints[1].y + 10 },
                        { x: innerPoints[2].x - 10, y: innerPoints[2].y - 10 },
                        { x: innerPoints[3].x + 10, y: innerPoints[3].y - 10 }
                    ];

                    // Отступы от контура
                    const outShift = isOuter ? 12 : 0; 
                    
                    // ИСПРАВЛЕНИЕ: Для внутренних размеров сдвигаем нижний размер ВВЕРХ (внутрь фигуры), 
                    // поэтому значение отрицательное (-15). Для внешних - положительное (12), чтобы сдвинуть вниз (наружу).
                    const bottomShift = isOuter ? 12 : -15;

                    ctx.fillText(`b=${win.top}`,
                        (dimPoints[0].x + dimPoints[1].x) / 2,
                        (dimPoints[0].y + dimPoints[1].y) / 2 - outShift);

                    ctx.fillText(`b=${win.bottom}`,
                        (dimPoints[2].x + dimPoints[3].x) / 2,
                        dimPoints[2].y + bottomShift);

                    ctx.save();
                    ctx.translate(dimPoints[3].x - outShift, (dimPoints[0].y + dimPoints[3].y) / 2);
                    ctx.rotate(-Math.PI / 2);
                    ctx.fillText(`h=${win.left}`, 0, 0);
                    ctx.restore();

                    ctx.save();
                    ctx.translate(dimPoints[2].x + outShift, (dimPoints[1].y + dimPoints[2].y) / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillText(`h=${win.right}`, 0, 0);
                    ctx.restore();
                    // --- КОНЕЦ ИЗМЕНЕНИЯ ---
                    
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    
                    if (win.zipper === '1') {
                        const topMidX = (innerPoints[0].x + innerPoints[1].x) / 2;
                        const topMidY = (innerPoints[0].y + innerPoints[1].y) / 2;
                        const bottomMidY = (outerPoints[2].y + outerPoints[3].y) / 2;
                        drawWavyLine(ctx, topMidX, topMidY, topMidX, bottomMidY);
                    } else if (win.zipper === '2') {
                        const isRect = isRectangle(win);
                        const leftInnerTop = innerPoints[0];
                        const rightInnerTop = innerPoints[1];
                        
                        if (isRect) {
                            drawWavyLine(ctx, leftInnerTop.x + zipperInnerOffset, leftInnerTop.y, 
                                       leftInnerTop.x + zipperInnerOffset, outerPoints[3].y);
                            drawWavyLine(ctx, rightInnerTop.x - zipperInnerOffset, rightInnerTop.y, 
                                       rightInnerTop.x - zipperInnerOffset, outerPoints[2].y);
                        } else {
                            drawWavyLine(ctx, leftInnerTop.x, leftInnerTop.y, leftInnerTop.x, outerPoints[3].y);
                            drawWavyLine(ctx, rightInnerTop.x, rightInnerTop.y, rightInnerTop.x, outerPoints[2].y);
                        }
                    }

                    // Вывод текста под фигурой с переносом строк
                    if (win.text && win.text.trim() !== '') {
                        ctx.font = '12px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        
                        const maxTextWidth = bottomWidth + 40; // Ограничиваем ширину текста шириной фигуры + небольшой запас
                        const words = win.text.split(' ');
                        let lines = [];
                        let currentLine = words[0] || '';
                        
                        for (let j = 1; j < words.length; j++) {
                            let testLine = currentLine + ' ' + words[j];
                            let metrics = ctx.measureText(testLine);
                            if (metrics.width > maxTextWidth) {
                                lines.push(currentLine);
                                currentLine = words[j];
                            } else {
                                currentLine = testLine;
                            }
                        }
                        lines.push(currentLine);
                        
                        const maxY = Math.max(...innerPoints.map(p => p.y), ...outerPoints.map(p => p.y));
                        const lineHeight = 14;
                        for (let j = 0; j < lines.length; j++) {
                            ctx.fillText(lines[j], centerX, maxY + 25 + j * lineHeight);
                        }
                    }
                    
                    x += bottomWidth + padding;
                    rowHeight = Math.max(rowHeight, windowHeight + 60);
                    figuresDrawn.push(i);
                }
                
                if (footerText.trim() !== '') {
                    ctx.font = `${footerFontSize}px Arial`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = '#000';
                    
                    const maxTextWidth = 400;
                    const lineHeight = footerFontSize * 1.2;
                    
                    const words = footerText.split(' ');
                    let lines = [];
                    let currentLine = words[0] || '';
                    
                    for (let i = 1; i < words.length; i++) {
                        let testLine = currentLine + ' ' + words[i];
                        let metrics = ctx.measureText(testLine);
                        if (metrics.width > maxTextWidth) {
                            lines.push(currentLine);
                            currentLine = words[i];
                        } else {
                            currentLine = testLine;
                        }
                    }
                    lines.push(currentLine);
                    
                    const boxPadding = 10;
                    let boxHeight = lines.length * lineHeight + boxPadding * 2;
                    let boxWidth = 0;
                    lines.forEach(line => {
                        let w = ctx.measureText(line).width;
                        if (w > boxWidth) boxWidth = w;
                    });
                    boxWidth += boxPadding * 2;
                    
                    const boxX = canvasWidth - sheetPadding - boxWidth;
                    const boxY = canvasHeight - sheetPadding - boxHeight;
                    
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);
                    
                    for (let i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], boxX + boxPadding, boxY + boxPadding + i * lineHeight);
                    }
                }

                container.appendChild(canvas);
                sheets.push(canvas);
                
                for (let i = figuresDrawn.length - 1; i >= 0; i--) {
                    figuresToDraw.splice(figuresDrawn[i], 1);
                }
                
                currentSheet++;
            }
        }

        function downloadDrawing() {
            const canvases = document.querySelectorAll('#canvasContainer canvas');
            
            if (canvases.length === 0) {
                alert('Нет чертежей для скачивания');
                return;
            }
            
            if (canvases.length === 1) {
                html2canvas(canvases[0]).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'windows-drawing.png';
                    link.href = canvas.toDataURL();
                    link.click();
                });
            } else {
                // Скачиваем все листы по очереди
                let downloadedCount = 0;
                const totalCanvases = canvases.length;
                
                canvases.forEach((canvas, index) => {
                    html2canvas(canvas).then(resultCanvas => {
                        const link = document.createElement('a');
                        link.download = `windows-drawing-sheet${index + 1}.png`;
                        link.href = resultCanvas.toDataURL();
                        link.click();
                        
                        downloadedCount++;
                        if (downloadedCount === totalCanvases) {
                            console.log('Все листы скачаны');
                        }
                    });
                });
            }
        }

        renderInputs();
    </script>
</body>
</html>
